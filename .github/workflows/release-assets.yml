name: Release Assets

on:
  release:
    types: [published, prereleased]

permissions:
  contents: write

jobs:
  bundle-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate
        run: deno task check && deno task test

      - name: Build bundles
        run: deno task build

      - name: Upload bundles to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/webluabridge.bundle.js
            dist/webluabridge.bundle.min.js
          fail_on_unmatched_files: true
